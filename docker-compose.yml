services:
  # 1. Redis Task Queue & Caching
  redis:
    image: redis:7-alpine
    container_name: myyt_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_myyt_secret}
    volumes:
      - redis_data:/data
    networks:
      - myyt_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_myyt_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myyt_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_myyt_secret}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-admin123}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-myyt@2026}
      - CORS_ORIGIN=https://${DOMAIN}
      - ENABLE_COOLDOWN=${ENABLE_COOLDOWN:-false}
      - VIDEO_COOLDOWN_SECONDS=${VIDEO_COOLDOWN_SECONDS:-0}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - myyt_internal
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_web}"
      # Route /api to Backend (HTTPS)
      - "traefik.http.routers.myyt-backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.myyt-backend.entrypoints=websecure"
      - "traefik.http.routers.myyt-backend.tls=true"
      - "traefik.http.routers.myyt-backend.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      # Route /api to Backend (HTTP fallback)
      - "traefik.http.routers.myyt-backend-http.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.myyt-backend-http.entrypoints=web"
      - "traefik.http.services.myyt-backend.loadbalancer.server.port=5000"

  # 3. Frontend Web Application (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: myyt_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - myyt_internal
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_web}"
      # Main Domain / Subdomain Routing (HTTPS)
      - "traefik.http.routers.myyt-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.myyt-frontend.entrypoints=websecure"
      - "traefik.http.routers.myyt-frontend.tls=true"
      - "traefik.http.routers.myyt-frontend.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      # Main Domain / Subdomain Routing (HTTP fallback)
      - "traefik.http.routers.myyt-frontend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.myyt-frontend-http.entrypoints=web"
      - "traefik.http.services.myyt-frontend.loadbalancer.server.port=80"

volumes:
  redis_data:
    driver: local

networks:
  myyt_internal:
    driver: bridge
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_web}
