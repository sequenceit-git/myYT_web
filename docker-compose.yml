services:
  # 1. Redis Task Queue & Caching
  redis:
    image: redis:7-alpine
    container_name: myyt_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_myyt_secret}
    volumes:
      - redis_data:/data
    networks:
      - myyt_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_myyt_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myyt_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_myyt_secret}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - CORS_ORIGIN=https://${DOMAIN}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - myyt_internal
      - ${TRAEFIK_NETWORK:-traefik_web}
    labels:
      - "traefik.enable=true"
      # Route /api to Backend
      - "traefik.http.routers.myyt-backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.myyt-backend.entrypoints=websecure"
      - "traefik.http.routers.myyt-backend.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.myyt-backend.loadbalancer.server.port=5000"
      # Dedicated API Subdomain (Optional)
      - "traefik.http.routers.myyt-api.rule=Host(`${API_DOMAIN:-api.${DOMAIN}`)"
      - "traefik.http.routers.myyt-api.entrypoints=websecure"
      - "traefik.http.routers.myyt-api.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.myyt-api.loadbalancer.server.port=5000"

  # 3. Frontend Web Application (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: myyt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - myyt_internal
      - ${TRAEFIK_NETWORK:-traefik_web}
    labels:
      - "traefik.enable=true"
      # Main Domain Routing
      - "traefik.http.routers.myyt-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.myyt-frontend.entrypoints=websecure"
      - "traefik.http.routers.myyt-frontend.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.myyt-frontend.loadbalancer.server.port=80"

volumes:
  redis_data:
    driver: local

networks:
  myyt_internal:
    driver: bridge
  # External network attached to your Traefik proxy
  traefik_web:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_web}
