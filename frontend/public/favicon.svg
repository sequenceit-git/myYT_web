<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="myytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="50%" stop-color="#e60026" />
      <stop offset="100%" stop-color="#b8001d" />
    </linearGradient>
    <linearGradient id="myytGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="myytShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#b8001d" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- YouTube Red Badge Container -->
  <rect x="4" y="8" width="56" height="48" rx="15" ry="15" fill="url(#myytGrad)" filter="url(#myytShadow)" />

  <!-- Top Gloss Highlight -->
  <path d="M 19 8 L 45 8 C 53 8 59 13 60 21 C 45 19 19 19 4 21 C 5 13 11 8 19 8 Z" fill="url(#myytGloss)" />

  <!-- Centered YouTube White Play Triangle -->
  <polygon points="26,20 44,32 26,44" fill="#ffffff" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
</svg>