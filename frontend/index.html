<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/image.png" />
  <link rel="shortcut icon" type="image/png" href="/image.png" />
  <link rel="apple-touch-icon" href="/image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ytCash — High-Velocity YouTube View Exchange & Engagement</title>
  <!-- Google Fonts: Doppio One, IBM Plex Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Doppio+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Instant Mobile OAuth Return Redirect -->
  <script>
    (function() {
      try {
        var hash = window.location.hash ? window.location.hash.substring(1) : '';
        var search = window.location.search ? window.location.search.substring(1) : '';
        var fullPayload = hash || search;
        if (!fullPayload) return;
        var params = new URLSearchParams(fullPayload);
        var state = params.get('state');
        var hasAccessToken = fullPayload.indexOf('access_token=') !== -1;
        if (state === 'mobile_auth' || (hasAccessToken && (state === 'mobile_auth' || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)))) {
          var appUrl = 'ytcash://oauth#' + fullPayload;
          window.location.replace(appUrl);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-[#f8fafc] text-[#0f172a] antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
